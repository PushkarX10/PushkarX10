<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="gridFade" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0">
    <stop stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="url(#gridFade)" stroke-width="1"/>
  </pattern>

</defs>

<!-- background -->

<rect width="1200" height="360" rx="18" fill="#080A0D"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)" opacity="0.55"/>

<!-- ambient scan -->

<rect
  x="-250"
  y="0"
  width="250"
  height="360"
  fill="url(#accent)"
  opacity="0.07"
>
  <animate
    attributeName="x"
    from="-250"
    to="1200"
    dur="7s"
    repeatCount="indefinite"
  />
</rect>

<!-- system nodes -->

<g opacity="0.65">

  <circle cx="94" cy="82" r="2" fill="white">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="72" r="2" fill="white">
    <animate attributeName="opacity" values="1;0.15;1" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1010" cy="292" r="2" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
  </circle>

  <circle cx="164" cy="278" r="2" fill="white">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- connecting lines -->

<g stroke="white" stroke-opacity="0.10">

  <path d="M94 82 L300 130"/>
  <path d="M1080 72 L910 130"/>
  <path d="M164 278 L320 225"/>
  <path d="M1010 292 L880 225"/>

</g>

<!-- top label -->

<text
  x="600"
  y="74"
  text-anchor="middle"
  fill="#858B93"
  font-family="monospace"
  font-size="13"
  letter-spacing="4"
>
  PUSHKARX10 / SYSTEM ONLINE
</text>

<!-- main identity -->

<text
  x="600"
  y="165"
  text-anchor="middle"
  fill="#FFFFFF"
  font-family="Arial, Helvetica, sans-serif"
  font-size="64"
  font-weight="700"
  letter-spacing="-3"
>
  PUSHKAR UGALE
</text>

<!-- animated cursor -->

<rect x="603" y="185" width="9" height="2" fill="white">
  <animate
    attributeName="opacity"
    values="1;0;1"
    dur="0.9s"
    repeatCount="indefinite"
  />
</rect>

<!-- descriptor -->

<text
  x="600"
  y="220"
  text-anchor="middle"
  fill="#9AA1AA"
  font-family="monospace"
  font-size="14"
  letter-spacing="2"
>
  AI SYSTEMS  ·  FULL-STACK  ·  AUTOMATION
</text>

<!-- bottom status -->

<g font-family="monospace" font-size="11">

  <text x="52" y="322" fill="#5E656D">
    STATUS
  </text>

  <text x="104" y="322" fill="#D8DCE1">
    BUILDING
  </text>

  <circle cx="175" cy="318" r="3" fill="#FFFFFF" filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1.4s"
      repeatCount="indefinite"
    />
  </circle>

  <text x="1015" y="322" fill="#5E656D">
    v.2026
  </text>

</g>

<!-- bottom line -->

<rect x="52" y="337" width="1096" height="1" fill="white" opacity="0.08"/>

</svg>
